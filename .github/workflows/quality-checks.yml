name: SHIVAM Quality Checks

on:
  push:
    branches:
      - personal-jarvis
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shivam-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile api_server.py jarvis.py tools_engine.py snooze.py

  frontend-checks:
    name: Frontend tests and TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', fix=' + JSON.stringify(item.fixAvailable));"
      - name: Run frontend tests
        run: npm test
      - name: Run TypeScript and production web build
        run: npm run build

# This workflow intentionally does not invoke Gradle or produce an Android APK.

  android-java-check:
    name: Android Java compile (no APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set npm version
        run: npm install --global npm@11.19.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Build Capacitor web assets
        working-directory: frontend
        run: |
          npx tsc -b
          npx vite build --outDir dist
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx --yes --package=@capacitor/cli@8.6.0 cap sync android
      - name: Compile Android Java only (does not assemble APK)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac
